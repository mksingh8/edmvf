[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edmvf"
version = "0.1.0"
description = "Enterprise Data Migration Validation Framework"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "edmvf contributors" }]
license = { text = "MIT" }

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
